# Access log without query strings: /ws/cases?api_key=... must never be written to logs.
log_format safe '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_referer"';

server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout safe;

    location /api/ {
        proxy_pass http://backend:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 30M;
    }

    location /ws/ {
        proxy_pass http://backend:8765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
